<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylownie.pl - Panel Admina</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 font-sans p-4 md:p-8 hidden" id="admin-body">

    <div class="max-w-2xl mx-auto bg-white rounded-3xl shadow-xl p-6 md:p-8">
        <div class="border-b border-gray-100 pb-4 mb-6">
            <h1 class="text-2xl font-black tracking-tight text-gray-900 uppercase">STYL<span class="text-pink-600">OWNIE</span></h1>
            <p class="text-sm text-gray-500 mt-1">Panel dodawania towaru prosto z zaplecza w Nisku</p>
        </div>

        <form id="admin-form" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2 uppercase">Typ sprzedaży</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="border-2 border-pink-600 bg-pink-50 p-4 rounded-xl flex items-center justify-center cursor-pointer font-bold text-pink-700" id="label-detal">
                        <input type="radio" name="type" value="DETAL" checked class="hidden" onchange="toggleType('DETAL')"> DETAL (B2C)
                    </label>
                    <label class="border-2 border-gray-200 p-4 rounded-xl flex items-center justify-center cursor-pointer font-bold text-gray-500" id="label-hurt">
                        <input type="radio" name="type" value="HURT" class="hidden" onchange="toggleType('HURT')"> HURT (B2B Box)
                    </label>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nazwa produktu / modelu</label>
                    <input type="text" id="name" required placeholder="np. Nike Air Force 1" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Cena (PLN)</label>
                    <input type="number" step="0.01" id="price" required placeholder="249.00" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Kategoria</label>
                    <select id="category" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
                        <option value="buty">Buty</option>
                        <option value="odziez">Odzież</option>
                        <option value="mystery-box">Mystery Box</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Rozmiar</label>
                    <input type="text" id="size" required placeholder="np. 37.5 lub L" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Klasa stanu (Grade)</label>
                    <input type="text" id="condition_grade" placeholder="np. Premium lub Grade A" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Marka / Marki w pakiecie</label>
                <input type="text" id="brands" placeholder="np. Nike, Adidas" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Opis produktu</label>
                <textarea id="description" rows="3" placeholder="Krótki opis stanu, renowacji lub zawartości boxu..." class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Zdjęcia produktu (Możesz wybrać kilka)</label>
                <div class="border-2 border-dashed border-gray-300 rounded-2xl p-6 text-center bg-gray-50 hover:bg-gray-100 transition relative">
                    <input type="file" id="image" accept="image/*" multiple required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="space-y-1">
                        <p class="text-sm font-bold text-gray-700">Kliknij, aby dodać lub zrobić zdjęcia</p>
                        <p class="text-xs text-gray-500">Pierwsze wybrane zdjęcie będzie zdjęciem głównym</p>
                    </div>
                </div>
                
                <div id="preview-container" class="grid grid-cols-4 gap-3 mt-4"></div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-pink-600 text-white font-bold p-4 rounded-xl shadow-lg hover:bg-pink-700 transition uppercase tracking-wider mt-4">
                Wystaw produkt na sklep
            </button>
        </form>

        <hr class="my-10 border-gray-200">

        <div class="pb-4 mb-6">
            <h2 class="text-xl font-black tracking-tight text-gray-900 uppercase">Zarządzanie ogłoszeniami</h2>
            <p class="text-sm text-gray-500 mt-1">Dodaj nowy komunikat lub baner informacyjny na stronę główną</p>
        </div>

        <form id="announcement-form" class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nagłówek sekcji</label>
                    <input type="text" id="news-title" required placeholder="np. Aktualności & Planowane Dropy" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Etykieta statusu (Badge)</label>
                    <input type="text" id="news-status-badge" required placeholder="np. Drop w piątek lub Magazyn Pełny" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Główna treść ogłoszenia</label>
                <textarea id="news-content" rows="3" required placeholder="Wpisz pełną informację dla Twoich klientów..." class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Podtekst informacyjny (Mały tekst na dole)</label>
                <input type="text" id="news-subtext" required placeholder="np. Odbiór osobisty w Nisku prosimy umawiać telefonicznie..." class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:border-pink-600">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Zdjęcie do ogłoszenia (Opcjonalnie)</label>
                <div class="border-2 border-dashed border-gray-300 rounded-2xl p-4 text-center bg-gray-50 hover:bg-gray-100 transition relative">
                    <input type="file" id="news-image-file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="space-y-1">
                        <p class="text-xs font-bold text-gray-700">Wybierz pojedynczą grafikę ogłoszeniową</p>
                    </div>
                </div>
                <div id="news-preview-container" class="w-24 aspect-square mt-3 rounded-xl overflow-hidden hidden border border-gray-200">
                    <img id="news-img-preview-tag" src="" class="w-full h-full object-cover">
                </div>
            </div>

            <button type="submit" id="news-submit-btn" class="w-full bg-slate-900 text-white font-bold p-4 rounded-xl shadow-lg hover:bg-slate-800 transition uppercase tracking-wider mt-4">
                Opublikuj ogłoszenie
            </button>
        </form>
    </div>

    <script>
        const HASLO = "Stylownie2026";
        const podaneHaslo = prompt("Podaj hasło administratora:");
        
        if (podaneHaslo !== HASLO) {
            alert("Brak dostępu!");
            document.body.innerHTML = "<h1 class='text-center text-red-600 font-bold mt-20'>BŁĄD AUTORYZACJI. ODMAWIAM DOSTĘPU.</h1>";
        } else {
            document.getElementById('admin-body').classList.remove('hidden');
        }

        const SUPABASE_URL = "https://bcizrlemxdecnzkzcxfi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_feyl5lfAJkE2FhXKJUb4WA_9ya9cSAw";

        // PODGLĄD ZDJĘĆ DLA TWOICH BUTÓW (NIENARUSZONY)
        document.getElementById('image').addEventListener('change', function(e) {
            const container = document.getElementById('preview-container');
            container.innerHTML = ''; 
            const files = e.target.files;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const url = URL.createObjectURL(file);
                container.innerHTML += `
                    <div class="relative aspect-square rounded-xl overflow-hidden border-2 border-gray-200 shadow-sm bg-gray-50">
                        <img src="${url}" class="w-full h-full object-cover">
                        <span class="absolute top-1 left-1 bg-black/70 text-white text-[10px] px-1.5 py-0.5 rounded-md font-bold">${i === 0 ? 'Główne' : i + 1}</span>
                    </div>`;
            }
        });

        // PODGLĄD ZDJĘCIA DLA NOWEGO FORMULARZA OGŁOSZEŃ
        document.getElementById('news-image-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const url = URL.createObjectURL(file);
                document.getElementById('news-img-preview-tag').src = url;
                document.getElementById('news-preview-container').classList.remove('hidden');
            }
        });

        function toggleType(type) {
            const lDetal = document.getElementById('label-detal');
            const lHurt = document.getElementById('label-hurt');
            if(type === 'DETAL') {
                lDetal.className = "border-2 border-pink-600 bg-pink-50 p-4 rounded-xl flex items-center justify-center cursor-pointer font-bold text-pink-700";
                lHurt.className = "border-2 border-gray-200 p-4 rounded-xl flex items-center justify-center cursor-pointer font-bold text-gray-500";
            } else {
                lHurt.className = "border-2 border-pink-600 bg-pink-50 p-4 rounded-xl flex items-center justify-center cursor-pointer font-bold text-pink-700";
                lDetal.className = "border-2 border-gray-200 p-4 rounded-xl flex items-center justify-center cursor-pointer font-bold text-gray-500";
            }
        }

        // AKCJA WYSTAWIANIA BUTÓW (NIENARUSZONA)
        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            const files = document.getElementById('image').files;
            const uploadedUrls = [];

            try {
                for (let i = 0; i < files.length; i++) {
                    btn.innerText = `Wgrywanie zdjęcia ${i + 1} z ${files.length}...`;
                    const file = files[i];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Math.random()}.${fileExt}`;
                    
                    const uploadResponse = await fetch(`${SUPABASE_URL}/storage/v1/object/zdjecia-produktow/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': file.type
                        },
                        body: file
                    });

                    if(!uploadResponse.ok) throw new Error(`Błąd wgrywania zdjęcia nr ${i+1}`);
                    const imgUrl = `${SUPABASE_URL}/storage/v1/object/public/zdjecia-produktow/${fileName}`;
                    uploadedUrls.push(imgUrl);
                }

                btn.innerText = "Zapisywanie danych produktu...";

                const productData = {
                    name: document.getElementById('name').value,
                    type: document.querySelector('input[name="type"]:checked').value,
                    price: parseFloat(document.getElementById('price').value),
                    category: document.getElementById('category').value,
                    size: document.getElementById('size').value,
                    condition_grade: document.getElementById('condition_grade').value,
                    brands: document.getElementById('brands').value,
                    description: document.getElementById('description').value,
                    image_url: uploadedUrls[0],
                    image_urls: uploadedUrls 
                };

                const dbResponse = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(productData)
                });

                if(dbResponse.ok) {
                    alert("Sukces! Produkt z kompletem zdjęcia został wystawiony.");
                    document.getElementById('preview-container').innerHTML = '';
                    document.getElementById('admin-form').reset();
                } else {
                    alert("Błąd zapisu danych w bazie.");
                }
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Wystaw produkt na sklep";
            }
        });

        // NOWOŚĆ: AKCJA OBSŁUGI DRUGIEGO FORMULARZA (OGŁOSZENIA)
        document.getElementById('announcement-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('news-submit-btn');
            btn.disabled = true;
            btn.innerText = "Przetwarzanie...";

            const newsFile = document.getElementById('news-image-file').files[0];
            let finalImageUrl = null;

            try {
                // Jeśli wybrano zdjęcie dla aktualności, wgrywamy do tego samego magazynu
                if (newsFile) {
                    btn.innerText = "Wgrywanie grafiki ogłoszenia...";
                    const fileExt = newsFile.name.split('.').pop();
                    const fileName = `${Math.random()}.${fileExt}`;

                    const uploadResponse = await fetch(`${SUPABASE_URL}/storage/v1/object/zdjecia-produktow/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': newsFile.type
                        },
                        body: newsFile
                    });

                    if(!uploadResponse.ok) throw new Error("Problem podczas zapisu zdjęcia ogłoszenia.");
                    finalImageUrl = `${SUPABASE_URL}/storage/v1/object/public/zdjecia-produktow/${fileName}`;
                }

                btn.innerText = "Zapisywanie ogłoszenia w bazie...";

                const announcementData = {
                    title: document.getElementById('news-title').value,
                    status_badge: document.getElementById('news-status-badge').value,
                    content: document.getElementById('news-content').value,
                    subtext: document.getElementById('news-subtext').value,
                    image_url: finalImageUrl
                };

                const dbResponse = await fetch(`${SUPABASE_URL}/rest/v1/announcements`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(announcementData)
                });

                if(dbResponse.ok) {
                    alert("📢 Ogłoszenie pomyślnie opublikowane na stronie głównej!");
                    document.getElementById('news-preview-container').classList.add('hidden');
                    document.getElementById('announcement-form').reset();
                } else {
                    alert("Błąd zapisu ogłoszenia w bazie Supabase.");
                }
            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Opublikuj ogłoszenie";
            }
        });
    </script>
</body>
</html>
