<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administratora - STYLOWNIE.PL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased p-4 sm:p-8">

    <main class="max-w-6xl mx-auto space-y-8">
        
        <header class="flex flex-col sm:flex-row items-center justify-between border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-black uppercase tracking-wider text-pink-500">STYLOWNIE.PL</h1>
                <p class="text-xs text-slate-400 mt-1">Centrum dowodzenia butikiem stacjonarnym i online</p>
            </div>
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 text-center min-w-[160px]">
                <p class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">Klienci na stronie</p>
                <span id="active-visitors" class="text-2xl font-black text-emerald-400 animate-pulse">0</span>
            </div>
        </header>

        <section class="bg-slate-800/50 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-4 mb-4">
                <div class="flex items-center gap-3">
                    <span class="text-xl">📦</span>
                    <div>
                        <h2 class="text-sm font-black uppercase tracking-wider text-white">Menedżer Ogłoszeń i Asortymentu</h2>
                        <p class="text-[11px] text-slate-400">Usuwaj produkty lub oznaczaj jako sprzedane na Vinted / stacjonarnie</p>
                    </div>
                </div>
                <button onclick="pobierzProduktyDoMenedzera()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-colors cursor-pointer">🔄 Odśwież listę</button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-medium text-slate-300">
                    <thead class="text-[10px] font-black uppercase tracking-wider text-slate-500 border-b border-slate-700/50">
                        <tr>
                            <th class="pb-3 pl-2">Produkt</th>
                            <th class="pb-3">Kategoria</th>
                            <th class="pb-3">Rozmiar</th>
                            <th class="pb-3">Cena</th>
                            <th class="pb-3">Status</th>
                            <th class="pb-3 text-right pr-2">Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="manager-products-list" class="divide-y divide-slate-800/40">
                        <tr>
                            <td colspan="6" class="py-4 text-center text-slate-500 animate-pulse">Wczytywanie asortymentu z bazy...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        </main>

    <script>
        const SUPABASE_URL = "https://bcizrlemxdecnzkzcxfi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_feyl5lfAJkE2FhXKJUb4WA_9ya9cSAw";

        let zaladowaneProdukty = [];

        // Nasłuchiwanie obecności klientów na stronie
        async function pobierzObecnychKlientow() {
            try {
                const granicaCzasu = new Date(Date.now() - 45000).toISOString();
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/visitor_presence?last_seen=gt.${granicaCzasu}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const dane = await resp.json();
                document.getElementById('active-visitors').innerText = dane ? dane.length : 0;
            } catch(e) {}
        }
        setInterval(pobierzObecnychKlientow, 5000);
        pobierzObecnychKlientow();

        // POBIERANIE PRODUKTÓW DO MENEDŻERA OGLOSZEŃ
        async function pobierzProduktyDoMenedzera() {
            const tbody = document.getElementById('manager-products-list');
            try {
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                zaladowaneProdukty = await resp.json();
                tbody.innerHTML = '';

                if(zaladowaneProdukty.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-slate-500">Brak przedmiotów w bazie danych.</td></tr>`;
                    return;
                }

                zaladowaneProdukty.forEach(p => {
                    let fotka = p.image_urls && p.image_urls.length > 0 ? p.image_urls[0] : (p.image_url || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=100');
                    
                    // Określenie badge statusu
                    let statusBadge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded text-[10px] uppercase font-bold">Aktywne</span>`;
                    if(p.sold_at) {
                        statusBadge = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded text-[10px] uppercase font-bold">Sprzedane</span>`;
                    }

                    // Przyciski akcji
                    let akcjeHtml = `
                        <div class="flex items-center justify-end gap-1.5">
                            ${!p.sold_at ? `<button onclick="oznaczJakoSprzedane('${p.id}')" class="bg-amber-600 hover:bg-amber-700 text-white text-[10px] font-bold px-2 py-1 rounded transition-colors cursor-pointer">🤝 Sprzedane (Vinted)</button>` : ''}
                            <button onclick="usunProduktCalkowicie('${p.id}')" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-bold px-2 py-1 rounded transition-colors cursor-pointer">🗑️ Usuń</button>
                        </div>
                    `;

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-800/30 transition-colors">
                            <td class="py-3 pl-2 flex items-center gap-3">
                                <img src="${fotka}" class="w-10 h-10 object-cover rounded-lg border border-slate-700 bg-slate-800">
                                <div>
                                    <p class="font-bold text-white uppercase text-[11px] line-clamp-1">${p.name}</p>
                                    <p class="text-[9px] text-slate-400 font-bold uppercase">${p.brands || 'Vintage'}</p>
                                </div>
                            </td>
                            <td class="py-3 font-bold uppercase text-[11px] text-slate-400">${p.category}</td>
                            <td class="py-3 font-mono font-bold text-slate-200">R. ${p.size}</td>
                            <td class="py-3 font-black text-white">${parseFloat(p.price).toFixed(2)} zł</td>
                            <td class="py-3">${statusBadge}</td>
                            <td class="py-3 text-right pr-2">${akcjeHtml}</td>
                        </tr>
                    `;
                });

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-red-400">Błąd pobierania danych: ${err.message}</td></tr>`;
            }
        }

        // AKCJA 1: OZNACZ JAKO SPRZEDANE (ZAPISUJE CZAS SPRZEDAŻY)
        async function oznaczJakoSprzedane(id) {
            if(!confirm("Czy na pewno chcesz oznaczyć tę parę jako sprzedaną na Vinted lub stacjonarnie? Produkt zniknie ze sprzedaży i na 24h trafi do sekcji 'Ostatnio sprzedane'.")) return;
            try {
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ sold_at: new Date().toISOString() })
                });
                pobierzProduktyDoMenedzera();
            } catch(e) { alert("Błąd: " + e.message); }
        }

        // AKCJA 2: CAŁKOWITE USUNIĘCIE Z BAZY
        async function usunProduktCalkowicie(id) {
            if(!confirm("Czy na pewno chcesz bezpowrotnie usunąć ten przedmiot z bazy danych?")) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                pobierzProduktyDoMenedzera();
            } catch(e) { alert("Błąd: " + e.message); }
        }

        // Ładowanie startowe
        pobierzProduktyDoMenedzera();
    </script>
</body>
</html>
