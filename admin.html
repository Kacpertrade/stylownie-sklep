<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administratora - STYLOWNIE.PL</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-base font-black tracking-widest uppercase">STYLOWNIE</span>
                <span class="bg-pink-600 text-[10px] font-bold px-2 py-0.5 rounded uppercase">HQ Admin</span>
            </div>
            <a href="/" target="_blank" class="text-xs font-bold text-slate-400 hover:text-white transition-colors">🌐 Zobacz sklep na żywo</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="flex justify-center mb-10 bg-white p-1.5 rounded-xl border border-slate-200 max-w-md mx-auto text-xs font-bold uppercase tracking-wider shadow-xs">
            <button id="btn-tab-products" onclick="switchAdminTab('PRODUCTS')" class="w-1/2 py-3 rounded-lg transition-all bg-slate-900 text-white cursor-pointer">
                📦 Produkty (Buty / Boxy)
            </button>
            <button id="btn-tab-news" onclick="switchAdminTab('NEWS')" class="w-1/2 py-3 rounded-lg transition-all text-slate-600 hover:text-slate-900 cursor-pointer">
                📢 Aktualności & Dropy
            </button>
        </div>

        <div id="section-products" class="max-w-2xl mx-auto bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
            <div class="border-b border-slate-100 pb-4 mb-6">
                <h2 class="text-lg font-black uppercase text-slate-900 tracking-tight">Dodaj nowy towar do bazy</h2>
                <p class="text-xs text-slate-400 font-medium mt-0.5">Uzupełnij parametry, aby wystawić przedmiot w sekcji detalicznej lub hurtowej.</p>
            </div>

            <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-5 text-xs font-bold uppercase tracking-wide">
                
                <div>
                    <label class="block text-slate-500 mb-1.5">Typ sprzedaży</label>
                    <select id="prod-type" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                        <option value="DETAL">Pojedyncza perełka (DETAL 1/1)</option>
                        <option value="HURT">Mystery Box pakiet zbiorczy (HURT B2B)</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-500 mb-1.5">Nazwa przedmiotu / pakietu</label>
                        <input type="text" id="prod-name" placeholder="np. Nike Air Force 1" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1.5">Cena (PLN)</label>
                        <input type="number" step="0.01" id="prod-price" placeholder="np. 250.00" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-slate-500 mb-1.5">Rozmiar / Ilość</label>
                        <input type="text" id="prod-size" placeholder="np. 38 lub Box 10szt" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1.5">Marka (Tylko dla Detalu)</label>
                        <input type="text" id="prod-brand" placeholder="np. Nike" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1.5">Klasa / Stan (Tylko dla Hurtu)</label>
                        <input type="text" id="prod-grade" placeholder="np. Grade A" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-500 mb-1.5">Link do zdjęcia głównego</label>
                    <input type="url" id="prod-image" placeholder="Wklej publiczny URL zdjęcia z Storage Supabase" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                </div>

                <div>
                    <label class="block text-slate-500 mb-1.5">Opis przedmiotu</label>
                    <textarea id="prod-desc" rows="4" placeholder="Opisz stan, mankamenty, parametry wysyłki lub zawartość boxa..." class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-whiteNormalna czcionka"></textarea>
                </div>

                <button type="submit" id="prod-submit-btn" class="w-full bg-slate-900 text-white font-bold p-4 rounded-xl hover:bg-pink-600 transition-all text-xs tracking-widest cursor-pointer shadow-sm">
                    WYSTAW NA SKLEP
                </button>
            </form>
        </div>

        <div id="section-news" class="hidden max-w-2xl mx-auto bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm">
            <div class="border-b border-slate-100 pb-4 mb-6">
                <h2 class="text-lg font-black uppercase text-slate-900 tracking-tight">Opublikuj nową aktualność / baner</h2>
                <p class="text-xs text-slate-400 font-medium mt-0.5">Wpis na bieżąco zastąpi dotychczasowy komunikat na samej górze strony stylownie.pl</p>
            </div>

            <form id="news-form" onsubmit="handleNewsSubmit(event)" class="space-y-5 text-xs font-bold uppercase tracking-wide">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-slate-500 mb-1.5">Nagłówek sekcji</label>
                        <input type="text" id="news-title" placeholder="np. Aktualności & Planowane Dropy" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-slate-500 mb-1.5">Etykieta / Status Badge</label>
                        <input type="text" id="news-badge" placeholder="np. Status: Magazyn Pełny lub Drop w piątek" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                    </div>
                </div>

                <div>
                    <label class="block text-slate-500 mb-1.5">Główna treść ogłoszenia</label>
                    <textarea id="news-content" rows="3" placeholder="Wpisz główne ogłoszenie o dropie lub dostawie..." required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white"></textarea>
                </div>

                <div>
                    <label class="block text-slate-500 mb-1.5">Mniejszy podtekst informacyjny (Dół ogłoszenia)</label>
                    <input type="text" id="news-subtext" placeholder="np. Odbiór osobisty w Nisku prosimy umawiać telefonicznie..." required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none focus:bg-white">
                </div>

                <div>
                    <label class="block text-slate-500 mb-1.5">Link do mniejszej grafiki (Opcjonalnie)</label>
                    <input type="url" id="news-image" placeholder="Wklej URL wygenerowanej grafiki (Zostaw puste, aby wyświetlić ikonę głośnika)" class="w-full bg-white border border-slate-200 rounded-lg p-3 text-sm font-medium focus:border-pink-500 focus:outline-none">
                </div>
